name: Agregar una app
description: Añade una app a la lista del desinstalador.
title: "Agregar app"
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        El script usará los identificadores indicados para desinstalar la app y, si se proporciona, borrará la carpeta de instalación indicada. La carpeta se borra completa y de forma permanente; deja el campo vacío si no conoces la ruta exacta.
  - type: input
    id: app_name
    attributes:
      label: Nombre de la app
      description: Nombre que aparecerá en la lista de Windows.
      placeholder: EjemploApp
    validations:
      required: true
  - type: input
    id: winget_id
    attributes:
      label: ID de WinGet
      description: Identificador exacto del paquete en WinGet, si está disponible.
      placeholder: Editor.App
    validations:
      required: false
  - type: textarea
    id: appx_names
    attributes:
      label: Nombres de paquetes Appx
      description: Opcional. Un nombre exacto por línea; se desinstalará solo para el usuario actual.
      placeholder: |
        Editor.App
        Contoso.App
    validations:
      required: false
  - type: input
    id: program_folder
    attributes:
      label: Carpeta del programa
      description: Opcional. Ruta exacta en formato Raiz/carpeta/programa; se eliminará recursivamente. Déjala vacía si no estás seguro.
      placeholder: ProgramFiles/Empresa/Aplicacion
    validations:
      required: false

